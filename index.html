<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Weight Manager</title>
<style>
:root{
--bg:#0f1117;
--panel:#171c24;
--panel2:#1f2937;
--border:#2d3748;
--text:#f8fafc;
--muted:#94a3b8;
--blue:#2563eb;
--green:#10b981;
--red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.container{display:flex;height:100vh;position:relative}

/* Mobile Sidebar Overlays */
.sidebar{
width:280px;background:var(--panel);border-right:1px solid var(--border);
display:flex;flex-direction:column;transition:transform 0.3s ease;
z-index:100;
}
.logo-container {
display:flex;justify-content:space-between;align-items:center;padding:20px;
}
.logo{font-size:22px;font-weight:700}
.close-sidebar {
display:none;background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;
}
.clients{flex:1;overflow-y:auto;padding:10px}
.client{padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;word-break:break-all}
.client:hover{background:var(--panel2)}
.client.active{background:var(--blue)}
.sidebar-btn,.btn{border:none;border-radius:10px;color:white;font-weight:700;cursor:pointer}
.sidebar-btn{margin:15px;padding:12px;background:var(--green)}

/* Main Content Area */
.main{flex:1;padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
.mobile-nav {
display:none;align-items:center;gap:15px;background:var(--panel);
padding:12px 20px;border-bottom:1px solid var(--border);
}
.menu-btn {
background:none;border:none;color:var(--text);font-size:24px;cursor:pointer;
}

.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.title{font-size:28px;font-weight:700;word-break:break-all}
.controls{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.search,.input{
background:#111827;color:white;border:1px solid var(--border);
padding:12px;border-radius:10px;outline:none;
}
.search{flex:1;min-width:200px}
.btn{padding:12px 16px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--blue)}
.danger{background:var(--red)}

/* Responsive Grid Cards */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;width:100%}
.card{background:var(--panel);padding:18px;border:1px solid var(--border);border-radius:14px}
.card .label{color:var(--muted);font-size:14px}
.card .value{font-size:24px;font-weight:700;margin-top:8px;word-break:break-all}

/* Responsive Table / Card setup */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:#111827;padding:14px;text-align:left;font-size:14px;color:var(--muted)}
td{padding:14px;border-top:1px solid var(--border);font-size:15px}
.lot{color:#64748b;font-style:italic}
.action-btn{border:none;color:white;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.edit{background:var(--blue);margin-right:6px}
.delete{background:var(--red)}
.empty{text-align:center;padding:50px;color:var(--muted)}

/* Modal Adaptation */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);justify-content:center;align-items:center;padding:15px;z-index:200}
.modal-content{width:100%;max-width:520px;background:var(--panel);padding:24px;border-radius:16px;border:1px solid var(--border);max-height:90vh;overflow-y:auto}
.modal-content h2{margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* BREAKPOINTS FOR MOBILE & TABLETS */
@media(max-width:1024px){
    .stats{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:768px){
    .container{flex-direction:column;height:auto;min-height:100vh}
    .sidebar{
        position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);
        width:280px;height:100vh;box-shadow:5px 0 15px rgba(0,0,0,0.5);
    }
    .sidebar.open{transform:translateX(0)}
    .close-sidebar {display:block}
    .mobile-nav{display:flex}
    .main{padding:15px;height:auto;overflow:visible}
    .stats{grid-template-columns:1fr}
    .controls{flex-direction:column}
    .search,.btn{width:100%}
    .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="mobile-nav">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div style="font-weight:700;font-size:18px">Weight Manager</div>
</div>

<div class="container">
<div class="sidebar" id="sidebarNav">
<div class="logo-container">
    <div class="logo">Clients</div>
    <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
</div>
<div class="clients" id="clients"></div>
<button class="sidebar-btn" onclick="addClient()">+ New Client</button>
</div>

<div class="main">
<div class="header">
<div class="title" id="title">Select Client</div>
<div class="controls">
<input class="search" id="search" placeholder="Search code..." oninput="renderTable()">
<button class="btn primary" onclick="openModal()">+ Add Item</button>
<button class="btn danger" onclick="deleteClient()">Delete Client</button>
</div>
</div>

<div class="stats">
<div class="card"><div class="label">Total Items</div><div class="value" id="items">0</div></div>
<div class="card"><div class="label">Total Quantity</div><div class="value" id="qty">0</div></div>
<div class="card"><div class="label">Total Net Weight</div><div class="value" id="net">0</div></div>
</div>

<div id="content"></div>
</div>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2 id="modalTitle">Add Item</h2>

<div class="grid">
<input id="code" class="input full" placeholder="Code">
<input id="quantity" class="input" type="number" placeholder="Quantity" oninput="calcWeight()">
<input id="weight" class="input" type="number" placeholder="Weight" oninput="calcWeight()">
<input id="tare" class="input" type="number" placeholder="Tare" oninput="calcWeight()">
<input id="newWeight" class="input full" placeholder="Net Weight" readonly>
</div>

<div class="modal-actions">
<button class="btn" style="background:#4b5563" onclick="closeModal()">Cancel</button>
<button class="btn primary" id="saveBtn" onclick="saveItem()">Add</button>
</div>
</div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('clientWeightData'))||{};
let selectedClient=null;
let editingIndex=null;

function saveStorage(){
localStorage.setItem('clientWeightData',JSON.stringify(data));
}

function toggleSidebar() {
    const sidebar = document.getElementById('sidebarNav');
    sidebar.classList.toggle('open');
}

function calcWeight(){
const q=parseFloat(quantity.value)||0;
const w=parseFloat(weight.value)||0;
const t=parseFloat(tare.value)||0;
// Fixed math structure to maintain clean decimals
newWeight.value=(w-(t*q)).toFixed(2);
}

function addClient(){
const name=prompt('Client name:');
if(!name)return;
if(data[name]) return alert('Client already exists');
data[name]=[];
selectedClient=name;
saveStorage();
renderClients();
renderTable();
// Auto-close menu on mobile selection
if(window.innerWidth <= 768) toggleSidebar();
}

function deleteClient(){
if(!selectedClient)return alert('Select a client first');
if(confirm('Delete client?')){
delete data[selectedClient];
selectedClient=Object.keys(data)[0]||null;
saveStorage();
renderClients();
renderTable();
}
}

function renderClients(){
clients.innerHTML='';
Object.keys(data).forEach(c=>{
const div=document.createElement('div');
div.className='client'+(c===selectedClient?' active':'');
div.textContent=c;
div.onclick=()=>{
selectedClient=c;
renderClients();
renderTable();
if(window.innerWidth <= 768) toggleSidebar(); // Auto-collapse navigation drawer on mobile
};
clients.appendChild(div);
});
}

function renderTable(){
title.textContent=selectedClient||'Select Client';

if(!selectedClient){
content.innerHTML='<div class="empty">No client selected</div>';
return;
}

let itemsArr=data[selectedClient];
let searchText=search.value.toLowerCase();

let filtered=itemsArr.filter(x=>x.code.toLowerCase().includes(searchText));

items.textContent=filtered.length;
qty.textContent=filtered.reduce((a,b)=>a+Number(b.quantity),0);

// Rounding weights to avoiding strange JS decimal artifacts (e.g. 14.000000002)
let totalNet = filtered.reduce((a,b)=>a+Number(b.newWeight),0);
net.textContent=totalNet.toFixed(2);

if(filtered.length===0){
content.innerHTML='<div class="empty">No items found</div>';
return;
}

let rows='';

filtered.forEach(item=>{
let realIndex=itemsArr.indexOf(item);

rows+=`
<tr>
<td>${item.code}</td>
<td class="lot"></td>
<td>${item.quantity}</td>
<td>${item.weight}</td>
<td>${item.tare}</td>
<td>${item.newWeight}</td>
<td>
<div style="display:flex;">
<button class="action-btn edit" onclick="editItem(${realIndex})">Edit</button>
<button class="action-btn delete" onclick="deleteItem(${realIndex})">Delete</button>
</div>
</td>
</tr>`;
});

content.innerHTML=`
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Code</th>
<th>Lot Number</th>
<th>Quantity</th>
<th>Weight</th>
<th>Tare</th>
<th>Net Weight</th>
<th>Action</th>
</tr>
</thead>
<tbody>${rows}</tbody>
</table>
</div>`;
}

function openModal(){
if(!selectedClient) return alert('Select a client first');
editingIndex=null;
modalTitle.textContent='Add Item';
saveBtn.textContent='Add';
modal.style.display='flex';
}

function editItem(index){
const item=data[selectedClient][index];
editingIndex=index;

code.value=item.code;
quantity.value=item.quantity;
weight.value=item.weight;
tare.value=item.tare;
newWeight.value=item.newWeight;

modalTitle.textContent='Edit Item';
saveBtn.textContent='Save';
modal.style.display='flex';
}

function closeModal(){
modal.style.display='none';
editingIndex=null;
code.value='';
quantity.value='';
weight.value='';
tare.value='';
newWeight.value='';
}

function saveItem(){
const q=Number(quantity.value);
const w=Number(weight.value);
const t=Number(tare.value);

const item={
code:code.value.trim(),
lotNumber:'',
quantity:q,
weight:w,
tare:t,
newWeight:Number((w-(t*q)).toFixed(2))
};

if(!item.code || isNaN(item.quantity) || isNaN(item.weight) || isNaN(item.tare)){
alert('Fill all fields with valid numbers');
return;
}

if(editingIndex!==null){
data[selectedClient][editingIndex]=item;
}else{
data[selectedClient].push(item);
}

saveStorage();
closeModal();
renderTable();
}

function deleteItem(index){
if(confirm('Delete item?')){
data[selectedClient].splice(index,1);
saveStorage();
renderTable();
}
}

renderClients();
renderTable();
</script>
</body>
</html>
